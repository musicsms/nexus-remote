syntax = "proto3";
package nexus.protocol.v1;

// Spec Section 33.
message SessionHello {
  uint32 protocol_version = 1;
  string session_id = 2;
  string device_id = 3;
  bytes capability = 4;
  bytes ephemeral_public_key = 5;
}

// Spec Section 33.
message MouseMove {
  sint32 x = 1;
  sint32 y = 2;
}

message KeyEvent {
  uint32 physical_code = 1;
  uint32 logical_code = 2;
  bool pressed = 3;
  uint32 modifiers = 4;
}

message TextInput {
  string text = 1;
}

message MouseButton {
  uint32 button = 1;
  bool pressed = 2;
}

message MouseWheel {
  sint32 delta_x = 1;
  sint32 delta_y = 2;
}
